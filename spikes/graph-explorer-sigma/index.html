<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sigma + graphology 100k spike — RankeDB</title>
    <link rel="stylesheet" href="/src/explorer/style.css" />
  </head>
  <body>
    <main id="stage">
      <div id="graph"></div>
      <div id="overlay">
        <div id="hud">
          <span id="hud-scale">—</span>
          <span id="hud-fps">—</span>
        </div>
      </div>
    </main>
    <aside id="panel">
      <h1>Sigma × graphology</h1>
      <p class="lede">
        Throwaway spike. Generates a Ranke-Graph shaped archive in the browser and renders it,
        to find out where an explorer stops being interactive.
      </p>

      <label>
        Claims
        <select id="n">
          <option value="1000">1 000</option>
          <option value="10000" selected>10 000</option>
          <option value="50000">50 000</option>
          <option value="100000">100 000</option>
          <option value="300000">300 000</option>
        </select>
      </label>

      <label>
        Layout
        <select id="layout">
          <option value="random">random (instant)</option>
          <option value="circular">circular (instant)</option>
          <option value="circlepack" selected>circlepack by class</option>
          <option value="fa2-worker">ForceAtlas2 (worker)</option>
        </select>
      </label>

      <label class="check"><input type="checkbox" id="edges" checked /> draw edges</label>
      <label class="check"><input type="checkbox" id="hide-edges-on-move" checked /> hide edges while moving</label>
      <label class="check"><input type="checkbox" id="labels" /> draw labels</label>
      <label class="check"><input type="checkbox" id="size-by-degree" checked /> size by degree</label>

      <div class="row">
        <button id="load">Load &amp; render</button>
        <button id="bench">Run camera bench</button>
      </div>

      <pre id="log"></pre>
      <table id="results"></table>

      <p class="foot">
        Legend:
        <span class="dot" data-cls="source"></span>source
        <span class="dot" data-cls="derivation"></span>derivation
        <span class="dot" data-cls="entity"></span>entity
        <span class="dot" data-cls="relation"></span>relation
        <span class="dot" data-cls="contribution"></span>contribution
      </p>
    </aside>
    <script type="module" src="/src/explorer/main.ts"></script>
  </body>
</html>
