openapi: 3.0.3

info:
  title: ranke-db API
  version: 0.1.0
  description: |
    REST API for a single **ranke-db** stack: contribute signed claims and read
    the verifiable graph they form.

    A server hosts exactly **one stack**, launched from a config file — there is
    no tenant or archive routing in the paths.

    **Authentication is a pluggable adapter** (e.g. NoAuth, JWT, API key — and
    extensible), chosen by the stack's config; this contract therefore pins no
    auth scheme. Send whatever credential the configured adapter expects — the
    endpoints, the capability model, and the `401`/`403` outcomes are identical
    under any auth mode. Authorization is capability-based with a simple lattice
    **read ⊂ write ⊂ admin**:

      - **read**  — list branches, fetch claims within a closure, Cypher reads
      - **write** — contribute claims
      - **admin** — verification runs, storage-layer introspection, other privileged ops

    Claims are **signed CBOR** objects, content-addressed and referenced by their
    id (the handle). The API carries claims as their raw CBOR bytes
    (`application/cbor`) in both directions — there is **no JSON projection** of a
    claim. A client *contributes* one claim (PUT) or a set (POST, an atomic
    transaction) by sending the CBOR; a read returns the claim's CBOR, which is
    the canonical signed form — independently verifiable, never reconstructed.

    **Every read is bounded by a branch closure.** All access to claims and
    content goes through a branch name; you can only fetch what lies in that
    branch's closure. There is no branch-free access by raw id — that is an
    internal system operation and is never exposed. A claim outside the named
    branch's closure is `404`, indistinguishable from one that does not exist.

servers:
  - url: /

tags:
  - name: read
    description: Read the graph through a branch closure.
  - name: write
    description: Contribute claims to a branch.
  - name: verify
    description: Verify storage integrity — start, list, inspect, and stop verification runs.
  - name: system
    description: Operate and maintain the stack — liveness and storage introspection.

paths:
  /health:
    get:
      operationId: health
      summary: Liveness and readiness of the stack
      tags: [system]
      responses:
        "200":
          description: The stack is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /branches:
    get:
      operationId: listBranches
      summary: List branch names with their current head
      description: |
        Lists the branch names that exist, each with its current head id — a
        point-in-time snapshot (the head moves on every contribution). This is
        the entry point for discovery: a head is just a claim, so to inspect it
        fetch it via `GET /branches/{name}/claims/{id}`. Requires `read`.
      tags: [read]
      responses:
        "200":
          description: The branches in this stack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /storage/layers:
    get:
      operationId: listStorageLayers
      summary: List storage layers
      description: |
        Lists the stack's storage layers (read-through tiers) by **name and type
        only** — never connection details or secrets. Naming layers is what lets
        a verification run target one directly (a read-through view can mask the
        loss of an object on a deeper layer). Requires `admin`.
      tags: [system]
      responses:
        "200":
          description: The storage layers, top (cache) to bottom (authoritative).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageLayerList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /verification:
    get:
      operationId: listVerifications
      summary: List verification runs
      description: |
        Verification runs, newest first. Each report is a **point-in-time
        record**: a layer repaired externally (outage recovered, files restored)
        shows clean in a later run, so reports accumulate rather than overwrite.
        Requires `admin`.
      tags: [verify]
      responses:
        "200":
          description: The verification reports.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationReportList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: startVerification
      summary: Start a verification run
      description: |
        Start a run from a `VerificationConfig`: walk the closure rooted at
        `closure`, reading the named `layer` directly, re-checking each claim's
        signature and re-hashing its content up to `contentThreshold` bytes
        (larger content is skipped this run). Async — returns the running report
        immediately. May root at any branch or id: it returns *findings*, not
        contents, so it never leaks across closures. Requires `admin`.
      tags: [verify]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerificationConfig" }
      responses:
        "202":
          description: The run started; the running report is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /verification/{reportId}:
    parameters:
      - name: reportId
        in: path
        required: true
        description: The verification report id.
        schema: { type: string }
    get:
      operationId: getVerification
      summary: Show a verification run
      description: The report for a run (poll until `status` is `complete`). Requires `admin`.
      tags: [verify]
      responses:
        "200":
          description: The verification report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: stopVerification
      summary: Stop a verification run
      description: Stop a running verification; returns the report with `status` `stopped`. Requires `admin`.
      tags: [verify]
      responses:
        "200":
          description: The stopped report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /branches/{name}/claims:
    parameters:
      - $ref: "#/components/parameters/BranchName"
    post:
      operationId: contribute
      summary: Contribute a set of claims (bulk)
      description: |
        Contribute a **set** of claims to branch `{name}` as a single **atomic
        transaction** — all are appended, or none are. The request body is the
        claims as **signed CBOR** in ranke's bundle format (a subgraph; claims
        reference each other by their content-addressed ids). Content-addressed,
        so it is **idempotent**: re-contributing yields the same ids with no
        duplicates. Returns the ids (handles) of the contributed claims. For a
        single claim, **PUT it by id** instead. Requires `write`.
      tags: [write]
      requestBody:
        required: true
        content:
          application/cbor:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The transaction committed (or was already present).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContributionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /branches/{name}/claims/{id}:
    parameters:
      - $ref: "#/components/parameters/BranchName"
      - name: id
        in: path
        required: true
        description: The content-addressed claim id.
        schema: { type: string }
    get:
      operationId: getClaim
      summary: Fetch a claim within a branch's closure
      description: |
        Returns claim `{id}` as its **signed CBOR** bytes, **only if it lies in
        branch `{name}`'s closure** — the fundamental access guarantee. A claim
        that is superseded, contradicted, or otherwise outside the closure
        returns `404`, indistinguishable from one that does not exist. Raw by-id
        access (unbounded by a branch) is an internal system operation, never
        exposed. Requires `read`.
      tags: [read]
      responses:
        "200":
          description: The claim's signed CBOR bytes.
          content:
            application/cbor:
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putClaim
      summary: Contribute a single claim
      description: |
        Contribute a single claim to branch `{name}`, idempotently. The request
        body is the claim's **signed CBOR** bytes; its content-addressed id must
        equal `{id}` (otherwise `400`). Re-putting the same claim is a no-op. For
        more than one claim, POST the set to the collection as a transaction.
        Requires `write`.
      tags: [write]
      requestBody:
        required: true
        content:
          application/cbor:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: The claim is stored (newly, or already present).
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /branches/{name}/contents/{hash}:
    parameters:
      - $ref: "#/components/parameters/BranchName"
      - name: hash
        in: path
        required: true
        description: The content-addressed hash of the blob.
        schema: { type: string }
    get:
      operationId: getContent
      summary: Fetch content bytes within a branch's closure
      description: |
        Streams the content blob addressed by `{hash}` — **only if a claim in
        branch `{name}`'s closure references it** (same closure guarantee as
        claims; out-of-closure or unknown → `404`). The bytes verify against
        `{hash}` and size as they stream. This is the "source content" step of a
        read: walk claims by id, then pull the bytes you need. Requires `read`.
      tags: [read]
      responses:
        "200":
          description: The content bytes, streamed.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /branches/{name}/gql:
    parameters:
      - $ref: "#/components/parameters/BranchName"
    post:
      operationId: gql
      summary: Cypher query over a branch (optional)
      description: |
        Run a read-only Cypher query against branch `{name}`'s closure. This is
        an **optional feature**, available only when the stack is configured with
        a graph-native storage layer (e.g. neo4j) — otherwise it returns `501`.
        It is not the primary read path (see the `read` endpoints). Mutation is
        never expressed in Cypher (claims are created only via contribute), and a
        query observes the **exact same filter rules** as native reads (no
        superseded, contradicted, or out-of-closure claims). Requires `read`.
      tags: [read]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GqlQuery" }
      responses:
        "200":
          description: The query result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GqlResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501":
          description: No graph-native (Cypher) layer is configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  parameters:
    BranchName:
      name: name
      in: path
      required: true
      description: The branch name.
      schema: { type: string }

  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Authentication is required or failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        The subject lacks the required capability. The body carries the
        subject id so an operator can grant it in config (onboarding).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such branch or claim.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The contribution conflicts with the current head.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
        signer:
          type: string
          description: The contributor identity this stack signs with.
          example: "did:key:z6Mk..."

    BranchSummary:
      type: object
      required: [name, head]
      properties:
        name:
          type: string
        head:
          type: string
          description: The content-addressed head claim id.

    BranchList:
      type: object
      required: [branches]
      properties:
        branches:
          type: array
          items: { $ref: "#/components/schemas/BranchSummary" }

    StorageLayer:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          description: Adapter type (e.g. memory, filesystem, s3, postgres, neo4j).

    StorageLayerList:
      type: object
      required: [layers]
      properties:
        layers:
          type: array
          description: Read-through tiers, top (cache) to bottom (authoritative).
          items: { $ref: "#/components/schemas/StorageLayer" }

    VerificationConfig:
      type: object
      required: [closure]
      description: |
        Parameters for a verification run — the same shape whether declared in
        the stack config (scheduled/automatic) or posted ad-hoc.
      properties:
        closure:
          type: string
          description: Root of the closure to verify — a branch name or a claim id.
        layer:
          type: string
          description: |
            Storage layer (by name) to read directly. Omit to read the composed
            read-through view — which may mask the loss of an object on a deeper
            layer, so name a layer to verify it without blind spots.
        contentThreshold:
          type: integer
          description: |
            Max content size, in bytes, to re-read and re-hash per claim. Larger
            content is skipped this run (the claim's signature is still checked).
            Omit to verify all content regardless of size.

    VerificationReport:
      type: object
      required: [id, config, status, startedAt, ok]
      description: A point-in-time record of a verification run; embeds the config that produced it.
      properties:
        id:
          type: string
        config:
          $ref: "#/components/schemas/VerificationConfig"
        status:
          type: string
          enum: [running, complete, stopped, error]
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        claimsChecked:
          type: integer
        bytesRead:
          type: integer
        ok:
          type: boolean
          description: True when no failures were found in this run.
        failures:
          type: array
          items: { $ref: "#/components/schemas/VerificationFailure" }

    VerificationReportList:
      type: object
      required: [reports]
      properties:
        reports:
          type: array
          items: { $ref: "#/components/schemas/VerificationReport" }

    VerificationFailure:
      type: object
      required: [id, mode, layer]
      properties:
        id:
          type: string
          description: The claim or object id that failed.
        mode:
          type: string
          enum: [corrupt-bytes, invalid-content]
          description: |
            corrupt-bytes — stored bytes don't match their hash (storage rot/loss;
            self-heals via read-through if a deeper layer is intact).
            invalid-content — the claim itself doesn't validate (e.g. bad
            signature); unrepairable.
        layer:
          type: string
          description: The layer where the failure was observed.
        detail:
          type: string

    ContributionResult:
      type: object
      required: [ids]
      description: The result of a contribution transaction — the ids (handles) of the appended claims.
      properties:
        ids:
          type: array
          description: Content-addressed ids of the contributed claims, in order.
          items: { type: string }

    GqlQuery:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: A read-only Cypher query.
        parameters:
          type: object
          additionalProperties: true
          description: Optional named query parameters.

    GqlResult:
      type: object
      required: [columns, rows]
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          description: Row-major result; each row aligns with columns.
          items:
            type: array
            items: {}

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message.
        subject:
          type: string
          description: On 403, the subject id to grant in config.
