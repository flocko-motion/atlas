# Code generation config for the Go server side of the API.
# The OpenAPI spec (../openapi/openapi.yaml) is the single source of truth;
# this produces the typed models + a strict std-net/http server interface.
package: api
output: api/openapi.gen.go
generate:
  models: true
  strict-server: true
  std-http-server: true
  embedded-spec: true
