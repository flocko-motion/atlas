services:
  minio:
    image: minio/minio:latest
    container_name: rankedb-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      - net
    ports:
      - "127.0.0.1:8010:9000"
      - "127.0.0.1:8011:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  minio-data:
